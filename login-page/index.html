<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Startup Failure Predictor - Login</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

    <!-- PROJECT HEADER -->

    <div class="project-header">

        <h1>
            <i class="fa-solid fa-rocket"></i>
            Startup Failure Predictor
        </h1>

        <p>
            Predict. Analyze. Decide.
        </p>

    </div>


    <!-- LOGIN CONTAINER -->

    <div class="login-container">

        <div class="login-box">

            <h1>
                Login
            </h1>

            <p class="login-subtitle">
                Welcome back! Login to continue.
            </p>


            <!-- EMAIL -->

            <div class="input-box">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

                <i
                    class="fa-solid fa-envelope input-icon"
                ></i>

            </div>


            <!-- PASSWORD -->

            <div class="input-box password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    aria-label="Show password"
                >

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>


            <!-- OPTIONS -->

            <div class="options">

                <label>

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="button"
                class="login-btn"
                id="loginBtn"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                <span>
                    Login
                </span>

            </button>


            <!-- REGISTER -->

            <div class="register">

                Don't have an account?

                <a href="./register.html">
                    Register
                </a>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="./script.js"
    ></script>

</body>

</html>
